{{ define "content" }}
<form action="/add" method="post" style="max-width:400px; margin:2em auto; display:flex; flex-direction:column;">
    <label>Nom du produit</label>
    <input type="text" name="name" required>

    <label>Description</label>
    <textarea name="description" required></textarea>

    <label>Prix</label>
    <input type="number" step="0.01" name="price" required>

       <label>Stock</label>
    <input type="number" name="stock" required>

    <label>Réduction (%)</label>
    <input type="number" name="discount" min="0" max="100">

    <button class="btn" type="submit" style="margin-top:1em;">Ajouter le produit</button>
</form>
{{ end }}
